name: OpenWrt APK Packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package
        required: false
        default: dev
      release_tag:
        description: Optional existing GitHub Release tag to attach artifacts to
        required: false
        default: ""
      package_version:
        description: APK version for a manual build from the selected ref
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build APK (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86/64
            go_arch: amd64
            slug: x86-64
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c
          - target: x86/generic
            go_arch: "386"
            slug: x86-generic
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/x86/generic/openwrt-sdk-25.12.5-x86-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 0bd51089e1c94c736a4d2d345b24844aab091f1c50502e8e6facddcc6114fde6
          - target: mediatek/filogic
            go_arch: arm64
            slug: mediatek-filogic
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || inputs.ref || github.ref }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          path: workflow-tools
          sparse-checkout: |
            scripts/build-openwrt-apk.sh
            scripts/openwrt-package-check.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Restore OpenWrt SDK cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/openwrt-apk-work/${{ matrix.slug }}
          key: openwrt-apk-${{ runner.os }}-${{ matrix.slug }}-${{ matrix.sdk_sha256 }}-v2

      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            file \
            flex \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            tar \
            unzip \
            wget \
            zstd

      - name: Pin package source to the release tag
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*)
              ;;
            *)
              echo "release tag must use v<semver> form: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          source_version=$(git rev-parse HEAD)
          source_date=$(git show -s --format=%cs HEAD)
          source_hash=$(curl --fail --location --retry 3 --retry-delay 5 \
            "https://codeload.github.com/${{ github.repository }}/tar.gz/$RELEASE_TAG" |
            sha256sum | cut -d' ' -f1)

          sed -i -E \
            -e "s/^PKG_VERSION:=.*/PKG_VERSION:=${RELEASE_TAG#v}/" \
            -e "s/^PKG_SOURCE_DATE:=.*/PKG_SOURCE_DATE:=${source_date}/" \
            -e "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=${source_version}/" \
            -e "s/^PKG_HASH:=.*/PKG_HASH:=${source_hash}/" \
            openwrt/serpent-wrt/Makefile
      - name: Pin APK source to the selected commit
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        env:
          REQUESTED_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -eu
          package_version="$REQUESTED_PACKAGE_VERSION"
          if [ -z "$package_version" ]; then
            package_version="0.4.0-e2e.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$package_version" =~ ^[0-9]+(\.[0-9]+){2}(-[A-Za-z0-9][A-Za-z0-9.+-]*)?$ ]]; then
            echo "package_version must use semantic version syntax: $package_version" >&2
            exit 1
          fi

          source_version=$(git rev-parse HEAD)
          source_date=$(git show -s --format=%cs HEAD)
          source_subdir="serpent-wrt-${package_version}"
          source_archive="$RUNNER_TEMP/${source_subdir}.tar.gz"
          git archive --format=tar --prefix="${source_subdir}/" "$source_version" | gzip -n > "$source_archive"
          source_hash=$(sha256sum "$source_archive" | cut -d' ' -f1)
          source_url="file://${RUNNER_TEMP}"

          sed -i -E \
            -e "s|^PKG_VERSION:=.*|PKG_VERSION:=${package_version}|" \
            -e "s|^PKG_SOURCE_DATE:=.*|PKG_SOURCE_DATE:=${source_date}|" \
            -e "s|^PKG_SOURCE_VERSION:=.*|PKG_SOURCE_VERSION:=${source_version}|" \
            -e "s|^PKG_SOURCE_SUBDIR:=.*|PKG_SOURCE_SUBDIR:=${source_subdir}|" \
            -e "s|^PKG_SOURCE_URL:=.*|PKG_SOURCE_URL:=${source_url}|" \
            -e "s|^PKG_HASH:=.*|PKG_HASH:=${source_hash}|" \
            openwrt/serpent-wrt/Makefile
          echo "Pinned APK source to ${source_version} (${package_version})"
      - name: Use build helpers from workflow ref
        run: |
          install -m 0755 workflow-tools/scripts/build-openwrt-apk.sh scripts/build-openwrt-apk.sh
          install -m 0755 workflow-tools/scripts/openwrt-package-check.sh scripts/openwrt-package-check.sh

      - name: Build serpent-wrt OpenWrt package
        env:
          OPENWRT_SDK_URL: ${{ matrix.sdk_url }}
          OPENWRT_SDK_SHA256: ${{ matrix.sdk_sha256 }}
          OPENWRT_APK_REUSE_WORK_DIR: "1"
          OPENWRT_APK_WORK_DIR: ${{ runner.temp }}/openwrt-apk-work/${{ matrix.slug }}
          OPENWRT_APK_OUT_DIR: artifacts/openwrt-apk/${{ matrix.slug }}
          OPENWRT_APK_SUMS_NAME: SHA256SUMS-${{ matrix.slug }}
          OPENWRT_APK_ARTIFACT_SUFFIX: ${{ matrix.slug }}
          OPENWRT_FEEDS_UPDATE: "1"
          OPENWRT_PACKAGES_REF: 84f4958aff37296fc77a03b4592ee65ba8b9e7c2
        run: sh scripts/build-openwrt-apk.sh
      - name: Generate CycloneDX SBOM
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.go_arch }}
          GOOS: linux
        run: |
          GOARCH=amd64 GOOS=linux go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          cyclonedx-gomod app \
            -json \
            -licenses \
            -main cmd/serpent-wrt \
            -notimestamp \
            -output-version 1.4 \
            -output "artifacts/openwrt-apk/${{ matrix.slug }}/serpent-wrt-${{ matrix.slug }}.cdx.json" \
            .

          cd "artifacts/openwrt-apk/${{ matrix.slug }}"
          sha256sum serpent-wrt-*.apk serpent-wrt-*.cdx.json > "SHA256SUMS-${{ matrix.slug }}"

      - name: Attest package provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/openwrt-apk/${{ matrix.slug }}/*.apk

      - name: Attest package SBOM
        uses: actions/attest@v4
        with:
          subject-path: artifacts/openwrt-apk/${{ matrix.slug }}/*.apk
          sbom-path: artifacts/openwrt-apk/${{ matrix.slug }}/serpent-wrt-${{ matrix.slug }}.cdx.json


      - uses: actions/upload-artifact@v7
        with:
          name: serpent-wrt-apk-${{ matrix.slug }}
          path: artifacts/openwrt-apk/${{ matrix.slug }}/*
          if-no-files-found: error

      - name: Attach OpenWrt packages to GitHub Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            artifacts/openwrt-apk/${{ matrix.slug }}/* \
            --repo "${{ github.repository }}" \
            --clobber
