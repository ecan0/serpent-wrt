<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">OpenWrt APK release banner</title>
  <desc id="desc">A compact banner listing the supported OpenWrt APK package targets.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1720"/>
      <stop offset="0.55" stop-color="#0e2630"/>
      <stop offset="1" stop-color="#16291f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="180" rx="22" fill="url(#panel)"/>
  <g fill="none" stroke="#39f6d2" stroke-opacity="0.18" stroke-width="2">
    <path d="M48 92h178m152 0h178m152 0h178"/>
    <circle cx="226" cy="92" r="6" fill="#39f6d2"/>
    <circle cx="556" cy="92" r="6" fill="#39f6d2"/>
    <circle cx="886" cy="92" r="6" fill="#39f6d2"/>
  </g>
  <text x="64" y="58" fill="#f6fbf8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">OpenWrt APK packages</text>
  <text x="66" y="92" fill="#9bd5c7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">v0.3.1 r4 release assets with target-specific filenames and SHA-256 sums</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">
    <rect x="650" y="46" width="132" height="54" rx="12" fill="#102a32" stroke="#39f6d2" stroke-opacity="0.5"/>
    <text x="680" y="80" fill="#d8fff5">x86-64</text>
    <rect x="804" y="46" width="166" height="54" rx="12" fill="#102a32" stroke="#7ddf64" stroke-opacity="0.5"/>
    <text x="832" y="80" fill="#e7ffe2">x86-generic</text>
    <rect x="992" y="46" width="164" height="54" rx="12" fill="#102a32" stroke="#f1db54" stroke-opacity="0.5"/>
    <text x="1018" y="80" fill="#fff8c7">filogic</text>
  </g>
  <text x="66" y="135" fill="#d4e9e3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Workflow: OpenWrt APK Packages</text>
  <text x="650" y="135" fill="#d4e9e3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">OpenWrt 25.12 SDKs</text>
</svg>
