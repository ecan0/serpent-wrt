    <circle cx="308" cy="200" r="6"/>
    <circle cx="404" cy="210" r="6"/>
    <circle cx="506" cy="183" r="6"/>
    <circle cx="616" cy="151" r="6"/>
    <circle cx="732" cy="139" r="6"/>
    <circle cx="846" cy="168" r="6"/>
  </g>

  <g transform="translate(976 178)">
    <path d="M0 0l76-38c25-12 54 5 55 32l1 23c1 26-26 45-51 34L2 18z" fill="#f1db54" stroke="#0b1218" stroke-width="7" filter="url(#soft-glow)"/>
    <circle cx="72" cy="-8" r="7" fill="#071017"/>
    <path d="M102 6h46" stroke="#39f6d2" stroke-width="5" stroke-linecap="round"/>
    <path d="M102 6l33-20M102 6l34 20" stroke="#39f6d2" stroke-width="4" stroke-linecap="round"/>
