    <circle cx="284" cy="234" r="5" fill="#39f6d2"/>
    <circle cx="1042" cy="130" r="5" fill="#39f6d2"/>
    <circle cx="1042" cy="244" r="5" fill="#39f6d2"/>
  </g>

  <g filter="url(#soft-glow)">
    <path d="M138 217c62-64 145-70 214-24 73 49 146 42 216-23 71-66 162-70 236-11 56 44 117 56 192 34"
      fill="none" stroke="#0b1218" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M138 217c62-64 145-70 214-24 73 49 146 42 216-23 71-66 162-70 236-11 56 44 117 56 192 34"
      fill="none" stroke="url(#snake)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M138 217c62-64 145-70 214-24 73 49 146 42 216-23 71-66 162-70 236-11 56 44 117 56 192 34"
      fill="none" stroke="#eafffb" stroke-opacity="0.26" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g fill="#071017" opacity="0.72">
