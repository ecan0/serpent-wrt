<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">serpent-wrt banner</title>
  <desc id="desc">A neon circuit-styled snake over a dark router security banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071017"/>
      <stop offset="0.55" stop-color="#0b1b24"/>
      <stop offset="1" stop-color="#10251f"/>
    </linearGradient>
    <linearGradient id="snake" x1="150" y1="140" x2="920" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39f6d2"/>
      <stop offset="0.45" stop-color="#7ddf64"/>
      <stop offset="1" stop-color="#f1db54"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.95 0 0 0 0 0.74 0 0 0 0.75 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7ddf64" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <g opacity="0.42" fill="none" stroke="#39f6d2" stroke-width="2">
    <path d="M76 82h130v42h86"/>
    <path d="M84 278h112v-44h88"/>
    <path d="M902 78h140v52h80"/>
    <path d="M914 286h128v-42h86"/>
